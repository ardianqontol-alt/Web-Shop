name = "yanz-shop"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# Username ini otomatis jadi ADMIN saat pertama kali daftar (hanya jika belum ada admin).
# Ganti dengan username pilihanmu, lalu langsung daftar dengan username itu setelah deploy.
[vars]
ADMIN_USERNAME = "yanzadmin"

[[d1_databases]]
binding = "DB"
database_name = "yanz-shop-db"
database_id = "ISI_DATABASE_ID_DARI_WRANGLER_D1_CREATE"
